name: Update playlists

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Optional: keep logins out of the repo. Put the full config.json in a
      # repository secret named CONFIG_JSON and it replaces the committed one.
      - name: Use config from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: '[ -z "$CONFIG_JSON" ] || printf "%s" "$CONFIG_JSON" > config.json'

      - run: python run.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists
          git diff --cached --quiet && exit 0
          git commit -m "Update playlists"
          git pull --rebase
          git push
